name: Build iOS 17 Standard IPA

on:
  workflow_dispatch:
  push:
    branches: [ios17-lockdown]
    paths-ignore: ['README.md', 'README.en.md', 'Documentation/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Rebuild pairing engine (with iOS 17 lockdown path)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          mv Frameworks/WrapPinPairingFFI.xcframework /tmp/old-xcframework
          zsh scripts/build-pairing-engine.sh

      - name: Offline checks
        run: |
          cmp WrapPin/Services/LiveActivity/WrapPinActivityAttributes.swift \
            WrapPinLiveActivity/WrapPinActivityAttributes.swift
          python3 scripts/check-localization.py
          python3 scripts/test-failure-stages.py
          xcrun swiftc -parse-as-library scripts/test-pairing-import.swift \
            WrapPin/Services/Pairing/PairingService.swift \
            WrapPin/Services/Pairing/DevicePairingSupport.swift -o /tmp/pairing-check
          /tmp/pairing-check

      - name: Package unsigned Standard IPA
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ipa
        run: |
          mkdir -p "$OUTPUT_DIR"
          zsh scripts/package-ipa.sh standard

      - uses: actions/upload-artifact@v4
        with:
          name: WrapPin-Standard-iOS17-unsigned
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_DIR: ${{ runner.temp }}/ipa
        run: |
          VERSION="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tail -n 1)"
          BUILD="$(sed -n 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tail -n 1)"
          # The app compares this tag with "<version>.<build>" to offer updates.
          TAG="v${VERSION}.${BUILD}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump CURRENT_PROJECT_VERSION to publish a new one."
            exit 0
          fi
          SUBJECT="$(git log -1 --pretty=%s)"
          {
            echo "iOS 17.4+ build from \`${GITHUB_SHA::7}\`: ${SUBJECT}"
            echo
            echo "Install the .ipa with SideStore (choose the file from Files)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$IPA_DIR"/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WrapPin iOS 17 · ${VERSION} (Build ${BUILD})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
